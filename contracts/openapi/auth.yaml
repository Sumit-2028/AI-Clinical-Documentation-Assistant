openapi: 3.0.3
info:
  title: Clinical Memory System - Authentication
  version: 1.0.0
paths:
  /api/v1/auth/register:
    post:
      summary: Create a physician or patient account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created account identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '409':
          description: Email already exists
  /api/v1/auth/login:
    post:
      summary: Authenticate a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Access and refresh tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
  /api/v1/auth/refresh:
    post:
      summary: Rotate a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Rotated access and refresh tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
  /api/v1/auth/me:
    get:
      summary: Return the authenticated identity
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 1}
    RegisterRequest:
      type: object
      required: [full_name, email, password]
      additionalProperties: false
      properties:
        full_name: {type: string, minLength: 2, maxLength: 255}
        email: {type: string, format: email}
        password: {type: string, minLength: 8, maxLength: 1024}
        role: {type: string, enum: [physician, patient], default: physician}
    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token: {type: string, minLength: 1}
    TokenResponse:
      type: object
      required: [access_token, refresh_token, token_type]
      properties:
        access_token: {type: string}
        refresh_token: {type: string}
        token_type: {type: string, enum: [bearer]}
    UserResponse:
      type: object
      required: [id, email, full_name, role, is_active]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        full_name: {type: string}
        role: {type: string}
        is_active: {type: boolean}
        patient_id: {type: string, pattern: '^[0-9]{6,8}$', nullable: true}
