services:
  postgres:
    image: postgres:16-alpine
    container_name: clinical-memory-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment}
      POSTGRES_DB: ${POSTGRES_DB:-clinical_memory}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - clinical_memory_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-clinical_memory}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: clinical-memory-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in your local environment}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - clinical_memory_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot bucket creation.  Buckets do not exist by default, and the
  # application is deliberately not granted CreateBucket in a real deployment.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: clinical-memory-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in your local environment}
      S3_BUCKET: ${S3_BUCKET:-clinical-documents}
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$S3_BUCKET" &&
        mc anonymous set none "local/$$S3_BUCKET" &&
        mc version enable "local/$$S3_BUCKET"
    restart: "no"

  gateway:
    build:
      context: .
      dockerfile: infra/docker/gateway.Dockerfile
    container_name: clinical-memory-gateway
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment}@postgres:5432/${POSTGRES_DB:-clinical_memory}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in your local .env before starting the gateway}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-false}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-120}
      RATE_LIMIT_AUTH_REQUESTS_PER_MINUTE: ${RATE_LIMIT_AUTH_REQUESTS_PER_MINUTE:-20}
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-10485760}
      ALLOWED_UPLOAD_MIME_TYPES: ${ALLOWED_UPLOAD_MIME_TYPES:-text/plain,application/pdf,image/png,image/jpeg,image/webp,image/tiff}
      UPLOAD_MAGIC_BYTE_CHECK: ${UPLOAD_MAGIC_BYTE_CHECK:-true}
      STEP1_STORAGE_MODE: ${STEP1_STORAGE_MODE:-s3}
      S3_BUCKET: ${S3_BUCKET:-clinical-documents}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-minioadmin}}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in your local environment}}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX:-step1}
      S3_SSE: ${S3_SSE:-none}
      S3_SSE_KMS_KEY_ID: ${S3_SSE_KMS_KEY_ID:-}
      S3_PRESIGN_EXPIRY_SECONDS: ${S3_PRESIGN_EXPIRY_SECONDS:-300}
      S3_TIMEOUT_SECONDS: ${S3_TIMEOUT_SECONDS:-10}
      S3_MAX_RETRIES: ${S3_MAX_RETRIES:-2}
      S3_CREATE_BUCKET_IF_MISSING: ${S3_CREATE_BUCKET_IF_MISSING:-false}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    command:
      [
        "uvicorn",
        "services.gateway.app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]

volumes:
  clinical_memory_postgres_data:
  clinical_memory_minio_data:
